# Builds the app for the iOS Simulator, launches it once per scene in tools/screenshots.txt and
# saves the screenshots to the `screenshots` branch under <branch>/, so they can be viewed from a
# phone (or fetched by a Claude cloud session, which can't run Xcode).
name: Screenshots

on:
  push:
    branches: ["claude/**"]
    paths: ["Fairyland/**", "FairylandTests/**", "content/**", "art/**", "project.yml", "tools/screenshots.*", ".github/workflows/screenshots.yml"]
  workflow_dispatch:
    inputs:
      scenes:
        description: "Only these scenes (comma-separated names from tools/screenshots.txt). Empty = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests (FairylandTests) on a simulator, alongside the screenshots: their own check,
  # red or green in a few minutes.
  tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run the tests
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[6-9] Pro \(' | grep -oE '[0-9A-F-]{36}')
          test -n "$UDID" || { xcrun simctl list devices available; exit 1; }
          mkdir -p build
          status=0
          xcodebuild test -project Fairyland.xcodeproj -scheme Fairyland -destination "id=$UDID" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build/tests.log 2>&1 || status=$?
          # How long each map takes to build (PerformanceTests), pass or fail.
          grep '⏱' build/tests.log || true
          if [ "$status" -ne 0 ]; then
            grep -E '✘|Fatal error|error:' build/tests.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            tools/ci_errors.sh build/tests.log; exit 1
          fi
          grep -E 'Test run with|Executed' build/tests.log | tail -3

  screenshots:
    runs-on: macos-26
    # A full run of about 130 scenes (two of them filmed) takes two and a half hours at most, a
    # minute or so a scene; this leaves room. At 130 minutes, full runs were cut off before they
    # could publish anything.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild -version
          mkdir -p build
          xcodebuild -project Fairyland.xcodeproj -scheme Fairyland -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build > build/simulator.log 2>&1 \
            || { tools/ci_errors.sh build/simulator.log; exit 1; }
          # App Store Connect refuses a build without its privacy manifest (Fairyland/PrivacyInfo.xcprivacy).
          test -f build/DerivedData/Build/Products/Debug-iphonesimulator/Fairyland.app/PrivacyInfo.xcprivacy \
            || { echo "::error::PrivacyInfo.xcprivacy isn't in the app bundle"; exit 1; }

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[6-9] Pro \(' | grep -oE '[0-9A-F-]{36}')
          test -n "$UDID" || { xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Take screenshots
        run: |
          tools/screenshots.sh "${{ steps.sim.outputs.udid }}" \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Fairyland.app \
            shots tools/screenshots.txt "${{ inputs.scenes }}"

      # The simulator films at full resolution and a high bitrate (~140 MB a minute), over
      # GitHub's 100 MB a file: publish a big recording in 90 MB parts (<name>.mp4.part-aa, -ab…;
      # `cat <name>.mp4.part-* > <name>.mp4` joins them again).
      - name: Split big recordings
        run: |
          for f in shots/*.mp4; do
            [ -e "$f" ] || continue
            if [ "$(stat -f%z "$f")" -gt 94371840 ]; then
              split -b 90m "$f" "$f.part-" && rm "$f"
            fi
          done
          ls -l shots | grep -E 'mp4' || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Publish to the screenshots branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only its latest commit: the branch's whole history of pictures is gigabytes, and fetching it
          # all held this step up for half an hour. The retries below fetch just what's new since.
          git fetch --depth 1 origin screenshots || true
          git worktree add -B screenshots ../pub origin/screenshots 2>/dev/null \
            || { git worktree add --detach ../pub && cd ../pub && git checkout --orphan screenshots && git rm -rfq . && cd -; }
          mkdir -p "../pub/$BRANCH"
          cp shots/*.png "../pub/$BRANCH/"
          cp shots/*.mp4 shots/*.mp4.part-* "../pub/$BRANCH/" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "../pub/$BRANCH/COMMIT"
          cd ../pub
          git add -A
          git commit -qm "Screenshots of $BRANCH at ${GITHUB_SHA::7}" || exit 0
          # Other branches publish at the same time; each writes only its own folder, so catch up
          # and try again.
          for attempt in 1 2 3 4 5; do
            git push -q origin screenshots && exit 0
            sleep $((attempt * 3))
            git fetch -q origin screenshots && git rebase -q origin/screenshots
          done
          exit 1

      - name: Summary
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "## Screenshots of \`${BRANCH}\` at \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          for f in shots/*.png; do
            n=$(basename "$f")
            echo "**${n%.png}**<br><img src=\"https://github.com/${GITHUB_REPOSITORY}/blob/screenshots/${BRANCH}/${n}?raw=true\" width=\"260\">" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          for f in shots/*.mp4; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            echo "**${n%.mp4}** (video): https://github.com/${GITHUB_REPOSITORY}/blob/screenshots/${BRANCH}/${n}" >> "$GITHUB_STEP_SUMMARY"
          done
