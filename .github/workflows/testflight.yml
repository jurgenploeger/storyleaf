# Archives the app, signs it with Apple's cloud signing and uploads it to TestFlight, so builds
# reach testers without a Mac. Runs on every push to main that touches the app, or by hand.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID (Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list on that page
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_<id>.p8 file
#   APPLE_TEAM_ID   your 10-character team ID (developer.apple.com → Account → Membership details)
# The three IDs aren't sensitive, so they may be repository variables instead; the .p8 must be a secret.
# The key needs the Admin role: cloud signing creates the distribution certificate on first use.
# And, optional but stops an Apple email every build, one Apple Development certificate for signing:
#   DEV_CERT_P12       the certificate and its key exported from Keychain Access as a .p12, base64-encoded
#                      (base64 -i Certificates.p12 | pbcopy)
#   DEV_CERT_PASSWORD  the password you gave that .p12
name: TestFlight

on:
  push:
    branches: [main]
    paths: ["Storyleaf/**", "content/**", "art/**", "sound/**", "project.yml", "Config/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "$(printenv $s)" ] || missing="$missing $s"
          done
          [ -z "$missing" ] || { echo "::error::Missing repository secrets (or variables for the IDs):$missing"; exit 1; }

      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # Pasting on a phone can drop the BEGIN/END lines or the line breaks, so keep only the
          # base64 body and rebuild the PEM around it.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$key"
          openssl pkey -in "$key" -noout 2>/dev/null \
            || { echo "::error::ASC_KEY_P8 isn't a valid private key: paste the whole contents of AuthKey_$ASC_KEY_ID.p8 and nothing else."; exit 1; }

      - name: Generate the Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          # Unique and increasing for every upload; a re-run gets a new attempt number.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          brew install xcodegen
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "CURRENT_PROJECT_VERSION = $BUILD_NUMBER"
          } > Config/Local.xcconfig
          xcodegen generate

      - name: Install the development certificate
        # With one kept in the secrets (DEV_CERT_P12, DEV_CERT_PASSWORD), signing uses it instead of
        # making a new one on each fresh runner, which the step below then revoked: Apple emails
        # "Your Certificate Has Been Revoked" for each. Without it, the old way still works.
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          [ -n "$DEV_CERT_P12" ] || { echo "No DEV_CERT_P12: signing makes a certificate of its own."; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          printf '%s' "$DEV_CERT_P12" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/dev.p12" -k "$keychain" -P "$DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::DEV_CERT_P12 didn't import: check it's the base64 of the .p12 and DEV_CERT_PASSWORD its password."; exit 1; }
          rm "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Clear old CI signing certificates
        # Each fresh runner's cloud signing makes a new development certificate when none is installed
        # (above); Apple caps them per account, so revoke the ones earlier runs left (only those the API
        # key made). With DEV_CERT_P12 set there are none to revoke.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet pyjwt cryptography
          python3 tools/asc_dev_certs.py "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID"

      - name: Archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
        run: |
          xcodebuild -version
          mkdir -p build
          # Pass the version straight to xcodebuild, where nothing can override it (an earlier
          # upload reached TestFlight as Xcode's default 1.0 (1)).
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          test -n "$VERSION" || { echo "::error::No MARKETING_VERSION in project.yml"; exit 1; }
          xcodebuild -project Storyleaf.xcodeproj -scheme Storyleaf -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Storyleaf.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > build/archive.log 2>&1 || { tools/ci_errors.sh build/archive.log; exit 1; }
          # Check what actually went into the app before uploading it.
          test -f build/Storyleaf.xcarchive/Products/Applications/Storyleaf.app/PrivacyInfo.xcprivacy \
            || { echo "::error::PrivacyInfo.xcprivacy isn't in the app (App Store Connect refuses builds without it)"; exit 1; }
          PLIST=build/Storyleaf.xcarchive/Products/Applications/Storyleaf.app/Info.plist
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          BUILT_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          echo "::notice::Archived Storyleaf $BUILT ($BUILT_NUMBER)"
          if [ "$BUILT" != "$VERSION" ] || [ "$BUILT_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "::error::The app says $BUILT ($BUILT_NUMBER) but should be $VERSION ($BUILD_NUMBER)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Storyleaf.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1 || { tools/ci_errors.sh build/export.log; exit 1; }

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "Uploaded Storyleaf $VERSION (${{ github.run_number }}.${{ github.run_attempt }}) at \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in TestFlight after Apple finishes processing (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
