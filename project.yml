# Source of truth for the Xcode project. Regenerate with `make project`
# (Fairyland.xcodeproj is generated and not checked in).
name: Fairyland

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.99"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Fairyland:
    type: application
    platform: iOS
    # Signing team and bundle ID prefix live in Config/*.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Fairyland
      # Folder reference: everything in art/ (manifest + generated sprites) is
      # copied into the app bundle as-is, so new sprites need no project changes.
      - path: art
        type: folder
        buildPhase: resources
      # Game data (maps, monsters, classes, quests, music) — also copied as-is.
      - path: content
        type: folder
        buildPhase: resources
      # Sound effects (made by tools/make_sounds.py).
      - path: sound
        type: folder
        buildPhase: resources
    info:
      path: Fairyland/Info.plist
      properties:
        CFBundleDisplayName: Storyleaf
        # The game translates itself (content/i18n), with no .lproj folders: this tells iOS and the
        # App Store which languages it speaks, so the store page lists them all and system screens
        # (the Files picker, the keyboard) follow the player's language.
        CFBundleLocalizations: [en, es, pt-BR, fr, de, it, ru, ja, ko, zh-Hans, zh-Hant]
        # XcodeGen defaults these to 1.0 / 1; point them at the build settings instead.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fairyland
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  FairylandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FairylandTests
    dependencies:
      - target: Fairyland
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fairyland.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Fairyland:
    build:
      targets:
        Fairyland: all
        FairylandTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FairylandTests
    archive:
      config: Release
